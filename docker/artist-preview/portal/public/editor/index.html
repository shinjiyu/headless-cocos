<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>图层编辑 · Artist Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --design-w: 2490;
      --design-h: 1400;
      --bg: #141416;
      --chrome: #1c1c1f;
      --panel: #1f1f23;
      --elev: #26262b;
      --line: #2e2e34;
      --text: #f0eee8;
      --muted: #8a8790;
      --faint: #5c5963;
      --accent: #e8a04a;
      --info: #6ea8d8;
      --font: 'Outfit', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'IBM Plex Mono', Consolas, monospace;
      --radius: 4px;
    }
    html { height: 100%; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 44px;
      padding: 0 12px;
      background: var(--chrome);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .topbar-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .topbar-title strong {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--faint);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 1px 6px;
      white-space: nowrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .topbar button, .view-menu summary {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--elev);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .topbar button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .topbar button:hover, .view-menu summary:hover { background: #2e2e34; }
    .topbar button.primary {
      background: var(--accent);
      border-color: transparent;
      color: #1a1208;
      font-weight: 600;
    }
    .topbar button.primary:hover { background: #f0b05e; }
    .edit-status {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .edit-status.is-busy { color: var(--accent); }
    .edit-status.is-error { color: #f07178; }
    .edit-status.is-ok { color: #7fd99a; }

    .topbar button.is-busy {
      pointer-events: none;
      opacity: 0.85;
      border-color: rgba(232, 160, 74, 0.55);
    }
    .spin {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .task-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 200;
      min-width: 260px;
      max-width: min(520px, 92vw);
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(22, 22, 26, 0.96);
      border: 1px solid rgba(232, 160, 74, 0.45);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text);
    }
    .task-toast.show { display: flex; }
    .task-toast.is-error { border-color: rgba(240, 113, 120, 0.55); }
    .task-toast.is-ok { border-color: rgba(127, 217, 154, 0.5); }
    .task-toast .toast-msg { flex: 1; line-height: 1.35; }
    .task-toast .toast-close {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0 2px;
      line-height: 1;
    }
    .preview-qr-modal {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .preview-qr-modal[hidden] { display: none !important; }
    .preview-qr-backdrop {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55);
    }
    .preview-qr-card {
      position: relative; z-index: 1; width: min(360px, 94vw);
      padding: 18px 18px 16px; border-radius: 14px;
      background: #16161a; border: 1px solid rgba(232, 160, 74, 0.35);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }
    .preview-qr-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 12px;
    }
    .preview-qr-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .preview-qr-x {
      border: 0; background: transparent; color: var(--muted);
      font-size: 20px; cursor: pointer; line-height: 1;
    }
    .preview-qr-canvas {
      display: flex; justify-content: center; align-items: center;
      min-height: 220px; padding: 8px; background: #fff; border-radius: 10px;
    }
    .preview-qr-canvas img, .preview-qr-canvas canvas { display: block; }
    .preview-qr-hint { margin: 12px 0 6px; font-size: 12px; color: var(--muted); }
    .preview-qr-link {
      display: block; font-size: 11px; word-break: break-all;
      color: #e8a04a; line-height: 1.35; margin-bottom: 12px;
    }
    .preview-qr-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .preview-qr-actions .btn {
      border: 1px solid var(--line); background: var(--elev); color: var(--text);
      border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
    }
    .preview-qr-actions .btn.primary {
      background: var(--accent); color: #1a1208; border-color: transparent;
    }
    .view-menu {
      position: relative;
    }
    .view-menu summary {
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .view-menu summary::-webkit-details-marker { display: none; }
    .view-menu[open] summary { border-color: rgba(232,160,74,.45); }
    .view-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 240px;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .view-pop label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .view-pop label input { accent-color: var(--accent); }
    #backPortal { color: var(--info); text-decoration: none; font-size: 12px; }
    html.embed #serveHint,
    html.embed #parserHint,
    html.embed #jobHint { display: none !important; }

    .app {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }
    .board {
      flex: 1;
      min-width: 0;
      display: grid;
      grid-template-columns: 28px 1fr;
      grid-template-rows: 28px 1fr;
      background: #101012;
    }
    .ruler-corner {
      grid-column: 1;
      grid-row: 1;
      background: var(--chrome);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .ruler-x, .ruler-y {
      display: block;
      background: #161618;
    }
    .ruler-x {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      height: 28px;
      border-bottom: 1px solid var(--line);
    }
    .ruler-y {
      grid-column: 1;
      grid-row: 2;
      width: 28px;
      height: 100%;
      border-right: 1px solid var(--line);
    }
    .board-viewport {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      transform-style: preserve-3d;
      background: #0c0c0e;
    }
    .fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .board-viewport.fx-on .fx-layer { opacity: 1; }
    .fx-layer::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        440px circle at var(--mx, 50%) var(--my, 40%),
        rgba(232, 160, 74, 0.1),
        transparent 58%
      );
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .board-viewport.fx-on.fx-hover .fx-layer::before { opacity: 1; }

    /* scrollbars */
    .inspector-tree,
    .stage-wrap,
    .view-pop {
      scrollbar-width: thin;
      scrollbar-color: #3a3a42 transparent;
    }
    .inspector-tree::-webkit-scrollbar,
    .stage-wrap::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .inspector-tree::-webkit-scrollbar-track,
    .stage-wrap::-webkit-scrollbar-track {
      background: transparent;
    }
    .inspector-tree::-webkit-scrollbar-thumb,
    .stage-wrap::-webkit-scrollbar-thumb {
      background: #3a3a42;
      border-radius: 4px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .inspector-tree::-webkit-scrollbar-thumb:hover,
    .stage-wrap::-webkit-scrollbar-thumb:hover {
      background: #52525c;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .stage-wrap.pick-3d {
      align-items: center;
      perspective: min(100vw, 2400px);
      perspective-origin: 50% 38%;
      -webkit-perspective: min(100vw, 2400px);
      -webkit-perspective-origin: 50% 38%;
    }
    .stage-wrap.pick-3d.pick-3d-grabbing { cursor: grabbing; }
    .stage.pick-3d {
      transform-style: preserve-3d;
      transform-origin: 50% 42%;
    }
    #tilesRoot.pick-3d {
      transform-style: preserve-3d;
      isolation: auto;
    }
    .stage {
      position: relative;
      width: calc(var(--design-w) * 1px);
      height: calc(var(--design-h) * 1px);
      transform-origin: top center;
      margin: 24px auto;
      background-color: #121214;
      background-image:
        linear-gradient(45deg, #18181b 25%, transparent 25%),
        linear-gradient(-45deg, #18181b 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #18181b 75%),
        linear-gradient(-45deg, transparent 75%, #18181b 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      box-shadow:
        0 0 0 1px var(--line),
        0 20px 60px rgba(0,0,0,.5);
      border-radius: 2px;
    }
    .stage-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 90000;
      opacity: 0;
      transition: opacity 0.2s ease;
      background-image:
        linear-gradient(to right, rgba(232, 160, 74, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(232, 160, 74, 0.07) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size:
        100px 100px,
        100px 100px,
        20px 20px,
        20px 20px;
      mix-blend-mode: screen;
    }
    .stage-grid.on { opacity: 1; }

    .crosshair-x,
    .crosshair-y {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .board-viewport.fx-on.fx-hover .crosshair-x,
    .board-viewport.fx-on.fx-hover .crosshair-y { opacity: 1; }
    .crosshair-x {
      left: 0;
      right: 0;
      height: 1px;
      top: var(--my, 0px);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(232, 160, 74, 0.55) 18%,
        rgba(232, 160, 74, 0.55) 82%,
        transparent
      );
      box-shadow: 0 0 10px rgba(232, 160, 74, 0.35);
    }
    .crosshair-y {
      top: 0;
      bottom: 0;
      width: 1px;
      left: var(--mx, 0px);
      background: linear-gradient(
        180deg,
        transparent,
        rgba(232, 160, 74, 0.55) 18%,
        rgba(232, 160, 74, 0.55) 82%,
        transparent
      );
      box-shadow: 0 0 10px rgba(232, 160, 74, 0.35);
    }
    .cursor-hud {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      transform: translate(14px, 14px);
      left: var(--mx, 0px);
      top: var(--my, 0px);
      padding: 5px 9px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      color: #f5e6c8;
      background: rgba(20, 20, 24, 0.86);
      border: 1px solid rgba(232, 160, 74, 0.38);
      box-shadow:
        0 6px 22px rgba(0, 0, 0, 0.5),
        0 0 24px rgba(232, 160, 74, 0.14);
      opacity: 0;
      transition: opacity 0.12s ease;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }
    .board-viewport.fx-on.fx-hover .cursor-hud { opacity: 1; }
    .cursor-hud b {
      color: var(--accent);
      font-weight: 600;
    }
    #tilesRoot { isolation: isolate; }
    .stage .tile {
      position: absolute;
      display: block;
      pointer-events: none;
      image-rendering: auto;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .stage .tile.pick-3d-interactive {
      pointer-events: auto;
      cursor: pointer;
    }
    .stage .tile.pick-3d-interactive:hover {
      outline: 1px solid rgba(232, 160, 74, 0.7);
      outline-offset: -1px;
    }
    .stage .tile.sel-outline {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      /* 禁止抬 z-index，避免选中看起来像「改了叠序/图层」 */
    }
    .wire {
      position: absolute;
      border: 1px dashed rgba(232, 160, 74, .45);
      pointer-events: none;
      font-size: 10px;
      color: rgba(240, 220, 180, .85);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 1px 2px;
      z-index: 99999;
    }
    .wire.hidden { border-color: rgba(212,115,115,.45); color: rgba(255,180,180,.7); }

    #clipRectOverlay, #marqueeRectOverlay {
      position: absolute;
      left: 0; top: 0; width: 0; height: 0;
      pointer-events: none;
      z-index: 100001;
      box-sizing: border-box;
      display: none;
      border: 1.5px solid rgba(232, 160, 74, 0.75);
      background: rgba(232, 160, 74, 0.05);
    }
    #marqueeRectOverlay {
      border-color: rgba(110, 168, 216, 0.75);
      background: rgba(110, 168, 216, 0.05);
      z-index: 100002;
    }
    #clipRectOverlay.visible, #marqueeRectOverlay.visible { display: block; }
    #clipRectLabel, #marqueeRectLabel {
      position: absolute;
      left: 6px; top: 6px;
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text);
      background: rgba(20,20,22,.75);
      padding: 2px 6px;
      border-radius: 2px;
    }

    .inspector {
      width: min(320px, 40vw);
      flex-shrink: 0;
      border-left: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .side-head {
      margin: 0;
      padding: 11px 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .side-head .count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--faint);
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }
    .inspector-tools {
      padding: 8px 10px;
      font-size: 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .tool-row {
      display: flex;
      gap: 6px;
    }
    .tool-row button {
      flex: 1;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--elev);
      color: var(--text);
      border-radius: var(--radius);
      padding: 5px 8px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .tool-row button:hover { background: #2e2e34; }
    .blend-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .blend-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 11.5px;
      cursor: pointer;
    }
    .blend-row input { accent-color: var(--accent); }

    .tree-pane {
      flex: 1 1 0;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
    }
    .inspector-tree {
      flex: 1 1 0;
      min-height: 0;
      overflow: auto;
      font-size: 12px;
    }

    .prop-pane {
      flex: 0 0 auto;
      max-height: 42%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #1a1a1e;
    }
    .prop-pane .side-head {
      background: #1c1c20;
    }
    .badge {
      display: inline-block;
      padding: 0 5px;
      border-radius: 2px;
      font-size: 10px;
      border: 1px solid var(--line);
      color: var(--muted);
      line-height: 16px;
    }
    .badge.psd-hidden { color: #d47373; border-color: rgba(212,115,115,.35); }
    .badge.full { color: #7cbc8a; border-color: rgba(124,188,138,.35); }
    .badge.bg-mark {
      color: var(--accent);
      border-color: rgba(232,160,74,.45);
    }

    .prop-body {
      overflow: auto;
      padding: 10px 12px 14px;
      font-size: 12px;
      min-height: 88px;
    }
    .prop-body.empty {
      color: var(--faint);
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      min-height: 88px;
    }
    .prop-grid {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px 10px;
      margin: 0;
      align-items: center;
    }
    .prop-grid dt {
      color: var(--faint);
      font-size: 11px;
    }
    .prop-grid dd {
      margin: 0;
      word-break: break-all;
      font-size: 11px;
      color: var(--text);
    }
    .prop-grid dd.mono { font-family: var(--mono); }
    .prop-grid input[type='text'],
    .prop-grid input[type='number'],
    .prop-grid select {
      width: 100%;
      box-sizing: border-box;
      background: var(--elev);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: var(--radius);
      padding: 4px 6px;
      font: inherit;
      font-size: 11px;
      font-family: var(--mono);
    }
    .prop-grid input[type='checkbox'] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
    }
    .prop-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .prop-actions button {
      flex: 1;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--elev);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 8px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .prop-actions button.primary {
      background: rgba(232, 160, 74, 0.2);
      border-color: rgba(232, 160, 74, 0.45);
      color: var(--accent);
    }
    .prop-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }
    .prop-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }

    /* —— 节点树：对齐 aiws layout-tree —— */
    .inspector-tree.layout-tree {
      flex: 1 1 0;
      min-height: 0;
      overflow: auto;
      padding: 4px 0;
      font-size: 12px;
    }
    .layout-tree-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px 3px 0;
      cursor: pointer;
      color: var(--text);
      white-space: nowrap;
      user-select: none;
      position: relative;
      min-height: 26px;
    }
    .layout-tree-item:hover { background: #242428; }
    .layout-tree-item.active {
      background: rgba(232, 160, 74, 0.14);
      color: #f0d0a0;
    }
    .layout-tree-item.layout-tree-draggable { cursor: grab; }
    .layout-tree-item.layout-tree-draggable:active { cursor: grabbing; }
    .layout-tree.layout-tree-dragging,
    .layout-tree.layout-tree-dragging .layout-tree-item {
      cursor: grabbing !important;
      user-select: none;
    }
    .layout-tree-item.layout-dragging {
      opacity: 0.4;
      pointer-events: none;
    }
    .layout-tree-item.drop-before::before,
    .layout-tree-item.drop-after::after {
      content: '';
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
      pointer-events: none;
      z-index: 2;
    }
    .layout-tree-item.drop-before::before { top: 0; }
    .layout-tree-item.drop-after::after { bottom: 0; }
    .layout-tree-item.drop-into {
      outline: 1px solid var(--accent);
      background: rgba(232, 160, 74, 0.12);
    }
    .layout-tree-item.inactive-node { opacity: 0.45; }
    .layout-tree-twist {
      width: 16px;
      flex-shrink: 0;
      text-align: center;
      color: var(--faint);
      font-size: 10px;
    }
    .layout-vis {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      margin: 0 4px 0 0;
      cursor: pointer;
      accent-color: var(--accent);
    }
    .layout-tree-name {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .layout-tree-badge {
      margin-left: 4px;
      font-size: 10px;
      color: var(--faint);
      font-family: var(--mono);
      flex-shrink: 0;
    }
    .muted { color: var(--faint); }
    .hint { color: var(--muted); font-size: 12px; }
    #boardLayoutHint, #pick3dHint { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <strong id="docTitle">加载中…</strong>
      <span class="chip" id="docFormatBadge">PSD</span>
      <span class="edit-status" id="editStatus"></span>
    </div>
    <div class="topbar-actions">
      <a id="backPortal" href="../">← 稿件库</a>
      <details class="view-menu">
        <summary>视图</summary>
        <div class="view-pop">
          <label><input type="checkbox" id="toggleGrid" checked /> 网格</label>
          <label><input type="checkbox" id="toggleCursorFx" checked /> 准星 / 坐标</label>
          <label><input type="checkbox" id="toggleWire" /> 线框</label>
          <label><input type="checkbox" id="toggleHidden" /> 线框含隐藏层</label>
          <label id="clipRectLabelWrap"><input type="checkbox" id="toggleClipRect" /> 截剪区辅助</label>
          <label><input type="checkbox" id="toggleMarqueeRect" /> 走马灯区辅助</label>
          <label><input type="checkbox" id="toggleStackReverse" checked /> 反转叠序</label>
          <label><input type="checkbox" id="togglePick3d" /> 3D 拾取</label>

      </details>
      <button type="button" id="btnMarkBg" title="标记 BgPlus 背景（不回写 PSD）">标为 BG</button>
      <button type="button" id="btnLoadingPreview" title="生成 Loading H5 并打开预览">
        <span class="spin" id="btnLoadingSpin" hidden aria-hidden="true"></span>
        <span id="btnLoadingLabel">Loading 页预览</span>
      </button>
      <button type="button" id="btnLoadingQr" hidden title="公网二维码供手机扫码">手机扫码</button>
      <button type="button" id="btnSaveEdit" class="primary" title="写入 scene-edit.json">保存</button>
    </div>
    <span id="serveHint" hidden></span>

  <div id="taskToast" class="task-toast" role="status" aria-live="polite">

    <button type="button" class="toast-close" id="taskToastClose" title="关闭">×</button>
  </div>
  <div class="app">
    <div class="board">
      <div class="ruler-corner" aria-hidden="true"></div>
      <canvas class="ruler-x" id="rulerX" width="800" height="28" aria-hidden="true"></canvas>
      <canvas class="ruler-y" id="rulerY" width="28" height="800" aria-hidden="true"></canvas>
      <div class="board-viewport">
        <div class="stage-wrap" id="stageWrap">
          <div class="stage" id="stage" aria-label="源稿切图拼接">
            <div class="stage-grid on" id="stageGrid" aria-hidden="true"></div>
            <div id="tilesRoot"></div>
            <div id="wireRoot" hidden></div>
            <div id="clipRectOverlay" aria-hidden="true">
              <span id="clipRectLabel"></span>
            </div>
            <div id="marqueeRectOverlay" aria-hidden="true">
              <span id="marqueeRectLabel"></span>
            </div>
          </div>

        <div class="fx-layer" id="fxLayer" aria-hidden="true">

          <div class="cursor-hud" id="cursorHud">x <b>0</b> · y <b>0</b></div>
        </div>
      </div>
    </div>
    <aside class="inspector" id="inspector">
      <div class="side-head">
        <span>节点树</span>
        <span class="count" id="treeCount">—</span>
      </div>
      <div class="inspector-tools">
        <div class="blend-row">
          <label><input type="radio" name="blendMode" value="normal" checked /> 混合：全部 normal</label>
          <label><input type="radio" name="blendMode" value="psd" /> 混合：PSD 原值</label>
        </div>
        <div class="tool-row">
          <button type="button" id="btnShowAll">全部显示</button>
          <button type="button" id="btnPsdDefault">按 PSD</button>
        </div>
      </div>
      <div class="tree-pane">
        <div class="inspector-tree layout-tree" id="inspectorTree"></div>
      </div>
      <div class="prop-pane">

      </div>
