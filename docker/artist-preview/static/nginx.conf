worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;
    charset utf-8;

    location = / {
      default_type text/plain;
      return 200 'psd-artist-preview static\nUse /preview/{jobId}/ or /preview/{jobId}/loading/\n';
    }

    location /healthz {
      default_type text/plain;
      return 200 'ok\n';
    }

    # Loading H5 Splash（Cursor/脚本产物）
    location ~ ^/preview/(?<job>[^/]+)/loading/(?<rest>.*)$ {
      root /data/jobs;
      try_files /$job/loading-h5/$rest /$job/loading-h5/index.html =404;
    }

    location ~ ^/preview/(?<job>[^/]+)/loading/?$ {
      root /data/jobs;
      try_files /$job/loading-h5/index.html =404;
    }

    # Cocos web-mobile（M2）
    location ~ ^/preview/(?<job>[^/]+)/(?<rest>.*)$ {
      root /data/jobs;
      try_files /$job/web-mobile/$rest /$job/web-mobile/index.html =404;
    }

    location ~ ^/preview/(?<job>[^/]+)/?$ {
      root /data/jobs;
      try_files /$job/web-mobile/index.html =404;
    }
  }
}
